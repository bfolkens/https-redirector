apiVersion: v1
kind: ConfigMap
metadata:
  name: https-redirect
data:
  default.conf: |
    server {
      access_log off;
      error_log /var/log/nginx/error.log warn;

      listen 80;

      location / {
        return 301 https://$host$request_uri;
      }

      location = /healthcheck {
        add_header Content-Type text/plain;
        return 200 'ok';
      }
    }
